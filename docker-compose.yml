services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pagemaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagemaster_dev}
      POSTGRES_DB: pagemaster
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_mock_logs.sql:/docker-entrypoint-initdb.d/01_init_mock_logs.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagemaster -d pagemaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-pagemaster_redis_dev}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pagemaster_redis_dev}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://pagemaster:${POSTGRES_PASSWORD:-pagemaster_dev}@postgres:5432/pagemaster
      MCP_READER_DATABASE_URL: postgresql://mcp_reader:${MCP_READER_PASSWORD:-mcp_reader_dev}@postgres:5432/pagemaster
      REDIS_URL: redis://:${REDIS_PASSWORD:-pagemaster_redis_dev}@redis:6379/0
      MCP_READER_PASSWORD: ${MCP_READER_PASSWORD:-mcp_reader_dev}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_IN_MEMORY: ${USE_IN_MEMORY:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      DRY_RUN: ${DRY_RUN:-true}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SHORTCODE: ${AFRICASTALKING_SHORTCODE:-}
      AFRICASTALKING_WEBHOOK_SECRET: ${AFRICASTALKING_WEBHOOK_SECRET:-}
      ONCALL_PHONE_NUMBER: ${ONCALL_PHONE_NUMBER:-}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-30}
      INFLIGHT_STALE_SECONDS: ${INFLIGHT_STALE_SECONDS:-60}
      ALLOW_QUERY_SECRET: ${ALLOW_QUERY_SECRET:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
